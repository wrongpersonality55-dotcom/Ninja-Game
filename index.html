 $('#sb').innerHTML=`<h3>${tx('lg')}</h3><div class="row"><button onclick="setLang('ur')">${G.lang=='ur'?'✔ ':''}اردو</button><button onclick="setLang('en')">${G.lang=='en'?'✔ ':''}English</button></div><h3>${tx('th')}</h3><div class="row">${Object.keys(TH).map(k=>`<button onclick="theme('${k}')">${TH[k].i} ${TH[k].n[ur()]}${k==G.th?' ✔':''}</button>`).join('')}</div><h3>${tx('sd')}</h3><button onclick="mute()">${S.mute?'🔇':'🔊'}</button>`}
const rr=()=>({home,shop,gift,acc,set:set_}[sn]||home)();
const setLang=l=>{G.lang=l;sG();document.documentElement.lang=l;$('#keys').textContent=tx('keys');rr()},theme=k=>{G.th=k;sG();applyTh();rr()},mute=()=>{S.mute^=1;sv();rr()};
function shop(){scr('shop');$('#st1').textContent='🛒 '+tx('shop');const it=[];
 WP.forEach((w,i)=>it.push(`<div class="it"><span>${tx('wn')[i]}<br><small>${tx('dmg')} ${w.d} · ${tx('rng')} ${w.r}</small></span>${S.own[i]?(S.w==i?`<b>${tx('eqd')}</b>`:`<button onclick="eq(${i})">${tx('eq')}</button>`):`<button onclick="buy(${i})" ${S.c>=w.c?'':'disabled'}>🪙${w.c}</button>`}</div>`));
 [['us',100],['ut',100],['uh',150]].forEach(([k,b],i)=>{const l=S[k],c=b*(l+1);it.push(`<div class="it"><span>${tx('upn')[i]}<br><small>${tx('lvl')} ${l}/5</small></span>${l>=5?`<b>${tx('max')}</b>`:`<button onclick="up('${k}',${c})" ${S.c>=c?'':'disabled'}>🪙${c}</button>`}</div>`)});
 $('#sl').innerHTML=it.join('');$('#hc2').textContent='🪙 '+S.c}
const buy=i=>{if(S.c>=WP[i].c){S.c-=WP[i].c;S.own[i]=1;S.w=i;sv();FX.coin();shop()}},eq=i=>{S.w=i;sv();shop()},up=(k,c)=>{if(S.c>=c){S.c-=c;S[k]++;sv();FX.coin();shop()}};
function gift(){scr('gift');$('#gt').textContent='🎁 '+tx('gift');$('#gb').innerHTML=S.d==new Date().toDateString()?`<p>${tx('gd')}</p>`:`<p>${tx('gp')}</p>`+[0,1,2].map(i=>`<span class="bx" onclick="pick(${i})">🎁</span>`).join('')}
function pick(i){const a=[30,50,80,120,200].sort(()=>Math.random()-.5).slice(0,3);S.c+=a[i];S.d=new Date().toDateString();sv();FX.win();$('#gb').innerHTML=`<p>${tx('gg')} 🪙${a[i]}!</p>`+a.map((v,j)=>`<span class="bx" style="font-size:34px;opacity:${j==i?1:.4}">🪙${v}</span>`).join('')}
function acc(){scr('acc');const ns=Object.keys(A.users),h=!ns.length;$('#at').textContent=h?tx('wl'):'👤 '+tx('acct');
 $('#al').innerHTML=(h?'':`<h3>${tx('sw')}</h3><div class="row">`+ns.map(n=>`<button onclick="pa('${n}')">${n==A.cur?'✔ ':''}${n}</button>`).join('')+'</div>'+(tg?`<div class="it"><span>${tx('pw')}: <b>${tg}</b></span><input id="lp" type="password"><button onclick="login()">${tx('ok')}</button></div>`:'')+'<hr>')
 +`<h3>${tx('nw')}</h3><div class="it"><input id="an" placeholder="${tx('nm')}" maxlength="16"><input id="ap" type="password" placeholder="${tx('pw')}"><button onclick="mk()">${tx('mk')}</button></div>`;$('#ac').hidden=h}
const pa=n=>{if(n==A.cur)return home();tg=n;acc()},err=k=>{$('#am').textContent=tx(k)};
async function mk(){const n=$('#an').value.trim(),p=$('#ap').value;if(!/^[\p{L}\p{N} _-]{1,16}$/u.test(n)||p.length<4)return err('e1');
 if(Object.keys(A.users).some(k=>k.toLowerCase()==n.toLowerCase()))return err('e2');
 const first=!Object.keys(A.users).length;A.users[n]=await hs(n,p);if(first){const o=localStorage.getItem('sn3');if(o)ls('sn3_'+n,o)}
 A.cur=n;sA();loadS(n);home()}
async function login(){const n=tg;if(await hs(n,$('#lp').value)==A.users[n]){A.cur=n;sA();loadS(n);home()}else err('e3')}
function pause(){if(st!='play')return;show('⏸ '+tx('ps'),tn(cur.t)+' · '+tx('lvl')+' '+cur.L,[['▶ '+tx('rs'),()=>st='play'],['↺ '+tx('rt'),()=>play(cur.t,cur.L)],['🏠 '+tx('hm'),home]])}
function over(){FX.lose();show('💀 '+tx('go'),tx('gl'),[['↺ '+tx('tr'),()=>play(cur.t,cur.L)],['🛒 '+tx('shop'),shop],['🏠 '+tx('hm'),home]])}
function win(){FX.win();const k=cur.t+cur.L,b=20+cur.d*2+lives*10;S.c+=b;S.s[k]=Math.max(S.s[k]||0,ns);if(cur.L<20&&S.p[cur.t]==cur.L)S.p[cur.t]++;sv();
 show('✅ '+tx('lc')+' '+'⭐'.repeat(ns)+'☆'.repeat(3-ns),tx('bn')+' +'+b+' 🪙',[...(cur.L<20?[['▶ '+tx('nx'),()=>play(cur.t,cur.L+1)]]:[]),['🛒 '+tx('shop'),shop],['🏠 '+tx('hm'),home]])}
function hurt(){if(inv>0)return;lives--;inv=1.6;P.vy=9;FX.hurt();hud();if(lives<=0)over()}
function dmg(e,k){e.hp-=k;e.x+=P.f*.4;if(e.hp<=0){FX.kill();W.remove(e.m);en=en.filter(q=>q!=e);S.c+=e.boss?50:5;sv()}else FX.hit();hud()}

function upd(dt){const p=P,d=(key.right?1:0)-(key.left?1:0),wp=WP[S.w];
 p.vx=d*7;if(d)p.f=d;
 if(act.jp){act.jp=0;if(p.g){p.vy=11;p.j=1;FX.jp()}else if(p.j<2){p.vy=10;p.j=2;FX.jp()}}
 p.vy=Math.max(p.vy-28*dt,-25);
 p.x+=p.vx*dt;blocks.forEach(b=>{if(hit(p,b))p.x=p.vx>0?b.x0-.3:b.x1+.3});
 p.y+=p.vy*dt;p.g=0;blocks.forEach(b=>{if(hit(p,b)){if(p.vy<=0){p.y=b.y1;p.g=1;if(b.s&&b.x1-b.x0>5)p.sp={x:b.x0+1.2,y:b.y1}}else p.y=b.y0-1.5;p.vy=0}});
 if(p.g)p.j=0;
 if(p.y<-9){lives--;hud();if(lives<=0)return over();FX.hurt();p.x=p.sp.x;p.y=p.sp.y+.1;p.vy=0;inv=2}
 cd-=dt;cs-=dt;inv-=dt;
 if(act.sw&&cd<=0){FX.sw();atk=.25;cd=.35;const x0=p.f>0?p.x:p.x-wp.r,x1=x0+wp.r;en.slice().forEach(e=>{if(e.x+e.w>x0&&e.x-e.w<x1&&Math.abs(e.y+e.h/2-(p.y+.75))<e.h/2+.9)dmg(e,wp.d+S.us)})}act.sw=0;
 if(act.st&&cs<=0){FX.st();cs=.5;const m=new T.Mesh(new T.TorusGeometry(.2,.07,6,4),M(0xdde6ff,1));W.add(m);sh.push({x:p.x,y:p.y+1,vx:p.f*15,l:1.2,m})}act.st=0;
 sh=sh.filter(a=>{a.x+=a.vx*dt;a.l-=dt;a.m.position.set(a.x,a.y,0);a.m.rotation.z+=dt*20;const e=en.find(e=>Math.abs(a.x-e.x)<e.w+.3&&a.y>e.y&&a.y<e.y+e.h);if(e){dmg(e,1+S.ut);a.l=0}if(a.l<=0){W.remove(a.m);return false}return true});
 if(atk>0){atk-=dt;me.sw.rotation.y=-1.3+2.6*(1-Math.max(atk,0)/.25)}else me.sw.rotation.y=-1.3;
 en.slice().forEach(e=>{const ch=!e.boss&&cur.d>=6&&Math.abs(p.x-e.x)<5&&Math.abs(p.y-e.y)<2;if(ch)e.dir=p.x>e.x?1:-1;
  e.x+=e.dir*e.v*(ch?1.6:1)*dt;if(e.x>e.x1){e.x=e.x1;e.dir=-1}if(e.x<e.x0){e.x=e.x0;e.dir=1}
  e.m.position.set(e.x,e.y,0);e.m.rotation.y=e.dir>0?PI/2:-PI/2;e.m.b.position.y=.75+Math.abs(Math.sin(t*9))*.06;
  if(Math.abs(p.x-e.x)<.3+e.w&&p.y<e.y+e.h&&p.y+1.5>e.y){if(p.vy<-1&&p.y>e.y+e.h*.55){dmg(e,1);p.vy=11;p.j=1}else hurt()}});
 saws.forEach(s=>{s.m.position.set(s.cx+Math.sin(t*1.5+s.ph)*s.amp,s.y,0);s.m.rotation.z+=dt*12;if(Math.hypot(s.m.position.x-p.x,s.y-(p.y+.75))<.95)hurt()});
 sp.forEach(k=>{if(p.x+.25>k.x0&&p.x-.25<k.x1&&p.y<k.y+.5)hurt()});
 cn=cn.filter(g=>{g.rotation.y+=dt*3;if(Math.hypot(g.position.x-p.x,g.position.y-(p.y+.75))<.8){W.remove(g);S.c++;sv();FX.coin();hud();return false}return true});
 stl=stl.filter(m=>{m.rotation.y+=dt*3;if(Math.hypot(m.position.x-p.x,m.position.y-(p.y+.75))<1){W.remove(m);ns++;FX.star();hud();return false}return true});
 const open=!boss||boss.hp<=0;goal.material.color.setHex(open?0xffd36b:0xff4466);goal.material.emissive.setHex(open?0xffd36b:0xff4466);goal.rotation.y+=dt*2;
 if(open&&Math.abs(p.x-gx)<1&&Math.abs(p.y-gy)<2.5)win()}

const kmap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jp',w:'jp',' ':'jp',j:'sw',x:'sw',k:'st',c:'st'};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'){if(e.key=='Enter')(sn=='acc')&&(tg&&$('#lp')&&document.activeElement==$('#lp')?login():mk());return}
 const k=e.key.length>1?e.key:e.key.toLowerCase();
 if(k=='p'||k=='Escape'){if(st=='play')pause();else if(st=='ov'&&$('#ot').textContent.startsWith('⏸'))$('#ob').firstChild.click();return}
 const a=kmap[k];if(!a)return;e.preventDefault();if(a=='left'||a=='right')key[a]=1;else if(!e.repeat)act[a]=1});
addEventListener('keyup',e=>{if(e.target.tagName=='INPUT')return;const a=kmap[e.key.length>1?e.key:e.key.toLowerCase()];if(a)key[a]=0});
document.querySelectorAll('.pad button').forEach(b=>{const a=b.dataset.a,s=a=='left'||a=='right';b.onpointerdown=e=>{e.preventDefault();s?key[a]=1:act[a]=1};b.onpointerup=b.onpointerleave=()=>{if(s)key[a]=0};b.oncontextmenu=e=>e.preventDefault()});
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();applyTh();document.documentElement.lang=G.lang;$('#keys').textContent=tx('keys');
if(A.cur&&A.users[A.cur]){loadS(A.cur)}else A.cur='';
cur={t:'e',L:1,d:1};build();A.cur?home():acc();
let last=performance.now();
(function loop(n){const dt=Math.min((n-last)/1e3,.05);last=n;t+=dt;if(st=='play')upd(dt);
 if(st!='home'){const p=P,pt=innerWidth<innerHeight?1.5:1;me.position.set(p.x,p.y,0);me.rotation.y=p.f>0?PI/2:-PI/2;me.visible=inv<=0||Math.floor(inv*10)%2==0;
  me.b.position.y=.75+(p.g&&p.vx?Math.abs(Math.sin(t*14))*.08:0);
  cam.position.lerp(new T.Vector3(p.x+2,Math.max(p.y,0)+4,13*pt),.1);cam.lookAt(cam.position.x,Math.max(p.y,0)+1.5,0);
  moon.position.set(cam.position.x-30,28,-50);stars.position.x=cam.position.x;cn.forEach(g=>g.rotation.y+=dt*2);R.render(sc,cam)}
 requestAnimationFrame(loop)})(last);
